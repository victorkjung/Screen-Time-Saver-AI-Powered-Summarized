name: CI

# Deprecated repo (see DEPRECATED.md) — CI is manual-only so pushes don't
# re-run tests or send failure emails. Trigger by hand if the repo is revived.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run tests
        run: pytest
